# Meta-Builder-Agent 部署文件（自包含）
# 组件：Milvus(etcd + MinIO + standalone) + Embedding 服务
# 业务库由用户自己的数据库提供，不在此部署
#
# 启动: docker compose up -d
# 停止: docker compose down
# 查看状态: docker compose ps
# 数据持久化在 ./volumes 目录

name: meta-builder-agent   # 项目名（容器组名），可改成任意名字

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"   # MinIO 控制台
      - "9000:9000"   # MinIO API
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530" # Milvus gRPC（SDK 连接用）
      - "9091:9091"   # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  embedding:
    container_name: embedding-server
    build:
      context: ./embedding
    volumes:
      - ./bge-large-zh-v1.5:/models/bge-large-zh-v1.5
    environment:
      - MODEL_PATH=/models/bge-large-zh-v1.5
    ports:
      - "8081:8081"
    restart: unless-stopped

  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4
    environment:
      MILVUS_URL: standalone:19530
    ports:
      - "3000:3000"
    depends_on:
      - standalone
    restart: unless-stopped

networks:
  default:
    name: milvus
