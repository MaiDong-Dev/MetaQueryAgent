[project]
name = "meta-builder-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.20.0",
    "fastapi>=0.110",
    "httpx>=0.27.0",
    "langgraph>=1.2.11",
    "omegaconf>=2.3.1",
    "pydantic>=2.13.5",
    "pymilvus>=3.0.1",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "client", "config"]
